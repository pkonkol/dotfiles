# ~/.termux/termux.properties (dotter: [termux]). Po zmianie: termux-reload-settings
# Fizyczna klawiatura: Volume-Up + Q chowa/pokazuje pasek extra-keys.

# przycisk wstecz = Esc, zeby vim dzialal tez bez klawiatury
back-key = escape
bell-character = ignore
# kursor stoi w miejscu (zsh-vi-mode go nie zmienia w Termuksie, patrz .zshrc)
terminal-cursor-style = bar
terminal-transcript-rows = 10000

extra-keys = [ \
  ['ESC', 'TAB', 'CTRL', 'ALT', '-', '/', '|', 'UP'], \
  ['~', 'HOME', 'END', 'PGUP', 'PGDN', 'LEFT', 'DOWN', 'RIGHT'] \
]
